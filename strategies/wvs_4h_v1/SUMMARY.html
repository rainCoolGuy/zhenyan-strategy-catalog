<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>真言门 · 需要密码</title>
<style>
:root { color-scheme: dark; }
body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh;
  display:flex; align-items:center; justify-content:center; background:#0f1115; color:#e8eaed; }
.card { background:#1a1d24; border:1px solid #30343c; border-radius:12px; padding:1.5rem 1.75rem;
  width:min(400px, 92vw); box-shadow:0 8px 32px rgba(0,0,0,.35); }
h1 { font-size:1.15rem; margin:0 0 .35rem; }
p { color:#9aa0a6; font-size:.9rem; margin:0 0 1rem; }
label { display:block; font-size:.85rem; margin-bottom:.35rem; color:#c4c7c5; }
input[type=password] { width:100%; box-sizing:border-box; padding:.65rem .75rem; border-radius:8px;
  border:1px solid #30343c; background:#0f1115; color:#e8eaed; font-size:1rem; }
button { margin-top:.85rem; width:100%; padding:.7rem; border:0; border-radius:8px;
  background:#8ab4f8; color:#0f1115; font-weight:600; font-size:.95rem; cursor:pointer; }
button:disabled { opacity:.6; cursor:wait; }
.err { color:#f28b82; font-size:.85rem; margin-top:.65rem; min-height:1.2em; }
#content { display:none; }
</style>
</head>
<body>
<div id="gate" class="card">
  <h1>真言门策略目录</h1>
  <p>此页已加密。请输入访问密码后继续。</p>
  <form id="form" autocomplete="current-password">
    <label for="pw">访问密码</label>
    <input id="pw" name="password" type="password" required autofocus/>
    <button type="submit" id="btn">进入</button>
    <div class="err" id="err"></div>
  </form>
</div>
<div id="content"></div>
<script src="../../auth.js"></script>
<script>
ZhenyanAuth.bootGate({ encPath: "../../enc/strategies/wvs_4h_v1/SUMMARY.html.enc", pageTitle: "SUMMARY" });
</script>
</body>
</html>
