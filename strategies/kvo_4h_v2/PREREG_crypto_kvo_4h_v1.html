<!DOCTYPE html>

<script>
(function () {
  try { if (localStorage.getItem("theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
  try {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { document.documentElement.classList.add("theme-ready"); });
    });
  } catch (e2) {}
})();
</script>
<script>
/* Sync: hide form / show boot if session token exists — before first paint of form */
(function () {
  try {
    var k = "zhenyan_catalog_key_v1";
    var p = "zhenyan_catalog_pw_v1";
    var has = (sessionStorage.getItem(k) || localStorage.getItem(k) ||
               sessionStorage.getItem(p) || localStorage.getItem(p));
    if (has) document.documentElement.classList.add("zy-autounlock");
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="../../assets/catalog.css"/>
</head>

    <label for="pw">访问密码</label>
    <input id="pw" name="password" type="password" required autofocus/>
